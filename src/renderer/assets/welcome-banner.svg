<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1418"/>
      <stop offset="0.55" stop-color="#0e1c20"/>
      <stop offset="1" stop-color="#0a1114"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fd0ad" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#2fd0ad" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="460" rx="22" fill="url(#bg)"/>
  <rect width="1400" height="460" rx="22" fill="url(#grid)"/>
  <ellipse cx="1180" cy="90" rx="300" ry="180" fill="#2fd0ad" opacity="0.07"/>
  <ellipse cx="120" cy="420" rx="280" ry="150" fill="#2fd0ad" opacity="0.05"/>

  <!-- left wordmark -->
  <rect x="86" y="150" width="6" height="150" rx="3" fill="#2fd0ad"/>
  <text x="122" y="238" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="700" fill="#f2f7f6" letter-spacing="-2">FreeMD</text>
  <text x="126" y="290" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="500" fill="#66e2c9" letter-spacing="5.4">MARKDOWN READER &amp; EDITOR</text>
  <text x="126" y="334" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" fill="#7d9599" letter-spacing="0.6">章节识别 · 公式渲染 · 图像预览 · 目录导航</text>
  <rect x="126" y="352" width="330" height="2" fill="url(#glow)"/>

  <!-- right: document stack -->
  <g transform="translate(760 78)">
    <rect x="26" y="18" width="440" height="300" rx="12" fill="#ffffff" opacity="0.045"/>
    <rect x="8" y="34" width="440" height="300" rx="12" fill="#ffffff" opacity="0.07"/>
    <rect x="-10" y="50" width="440" height="300" rx="14" fill="#f8fbfa"/>
    <rect x="-10" y="50" width="440" height="300" rx="14" fill="none" stroke="#2fd0ad" stroke-opacity="0.35" stroke-width="1.5"/>

    <rect x="34" y="86" width="12" height="34" rx="6" fill="#0d7a6a"/>
    <rect x="56" y="94" width="210" height="14" rx="7" fill="#153b3a"/>
    <rect x="56" y="114" width="126" height="8" rx="4" fill="#b8c7c6"/>

    <rect x="34" y="152" width="360" height="8" rx="4" fill="#c9d5d3"/>
    <rect x="34" y="170" width="330" height="8" rx="4" fill="#dbe4e2"/>
    <rect x="34" y="188" width="348" height="8" rx="4" fill="#dbe4e2"/>
    <rect x="34" y="206" width="180" height="8" rx="4" fill="#dbe4e2"/>

    <!-- formula chip -->
    <rect x="34" y="234" width="150" height="54" rx="9" fill="#eaf6f3" stroke="#2fd0ad" stroke-opacity="0.5"/>
    <text x="52" y="270" font-family="Cambria Math, Times New Roman, serif" font-size="24" fill="#0d7a6a">∑ f(x) dx</text>

    <!-- image chip -->
    <rect x="200" y="234" width="196" height="54" rx="9" fill="#f0f3f2" stroke="#0d7a6a" stroke-opacity="0.25"/>
    <circle cx="232" cy="252" r="7" fill="#2fd0ad"/>
    <path d="M216 280 L246 258 L268 276 L286 262 L310 280 Z" fill="#8fb6b0"/>
    <rect x="320" y="250" width="60" height="6" rx="3" fill="#c9d5d3"/>
    <rect x="320" y="264" width="44" height="6" rx="3" fill="#dbe4e2"/>

    <rect x="34" y="304" width="362" height="26" rx="13" fill="#0d7a6a" opacity="0.10"/>
  </g>
</svg>
